name: LoopLab
options:
  bundleIdPrefix: io.github.collinsomniac
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    minorVersion: 3.32.3
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    minorVersion: 0.32.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  LoopLab:
    type: application
    platform: iOS
    sources:
      - path: App
    entitlements:
      path: App/LoopLab.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LoopLab
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: "LoopLab runs a control server on this device so the Minis assistant can drive experiments."
        UIBackgroundModes: [processing]
        CFBundleURLTypes:
          - CFBundleURLName: io.github.collinsomniac.looplab
            CFBundleURLSchemes: [looplab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.collinsomniac.looplab
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
        OTHER_SWIFT_FLAGS: "-Xfrontend -warn-long-function-bodies=400"
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: mlx-swift
        product: MLX
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
