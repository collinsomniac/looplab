name: build-ipa
on:
  push:
    branches: [main]
    paths: ["App/**", "project.yml", ".github/workflows/build.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: build-ipa
  cancel-in-progress: true
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
      - name: Generate project
        run: xcodegen generate
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project LoopLab.xcodeproj -scheme LoopLab -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipMacroValidation -skipPackagePluginValidation \
            -archivePath "$RUNNER_TEMP/LoopLab.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*(deprecated|unavailable)|BUILD|ARCHIVE" | head -200
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: build-log, path: "${{ runner.temp }}/build.log" }
      - name: Package IPA + SideStore source
        id: pkg
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/LoopLab.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          rm -rf "$APP/_CodeSignature" "$APP/embedded.mobileprovision"
          # keep the entitlements request visible to the re-signer
          cp App/LoopLab.entitlements "$APP/LoopLab.entitlements.plist" || true
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=${{ github.run_number }}
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$APP/Info.plist"
          SHORT=$(git rev-parse --short HEAD)
          NAME="LoopLab-$VERSION-$BUILD.ipa"
          mkdir -p "$RUNNER_TEMP/pkg/Payload"; cp -R "$APP" "$RUNNER_TEMP/pkg/Payload/"
          (cd "$RUNNER_TEMP/pkg" && zip -qry "$RUNNER_TEMP/$NAME" Payload)
          SIZE=$(stat -f%z "$RUNNER_TEMP/$NAME")
          TAG="build-$BUILD"
          python3 - "$NAME" "$SIZE" "$TAG" "$VERSION.$BUILD" <<'PY'
          import json, sys, datetime, os
          name, size, tag, ver = sys.argv[1], int(sys.argv[2]), sys.argv[3], sys.argv[4]
          repo = os.environ["GITHUB_REPOSITORY"]
          src = {"name": "LoopLab builds", "identifier": "io.github.collinsomniac.looplab.source",
                 "apps": [{"name": "LoopLab", "bundleIdentifier": "io.github.collinsomniac.looplab",
                           "developerName": "collinsomniac", "localizedDescription": "On-device looped-LM research lab.",
                           "iconURL": "", "versions": [{"version": ver, "date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                           "downloadURL": f"https://github.com/{repo}/releases/download/{tag}/{name}", "size": size}]}]}
          json.dump(src, open(os.path.join(os.environ["RUNNER_TEMP"], "sidestore-source.json"), "w"), indent=2)
          PY
          echo "name=$NAME" >> "$GITHUB_OUTPUT"; echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "${{ steps.pkg.outputs.tag }}" "$RUNNER_TEMP/${{ steps.pkg.outputs.name }}" "$RUNNER_TEMP/sidestore-source.json" \
            --title "LoopLab ${{ steps.pkg.outputs.tag }}" --notes "Unsigned IPA from ${GITHUB_SHA}. Install/update via SideStore." --latest
          # stable URL for the SideStore source: always points at the latest release asset
          echo "source: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/sidestore-source.json" >> "$GITHUB_STEP_SUMMARY"
